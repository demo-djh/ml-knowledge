<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML‑Knowledge 机器学习知识库</title>

  <script src="https://unpkg.com/docsify@4.13.0/lib/docsify.min.js"></script>
  <script src="https://unpkg.com/docsify@4.13.0/lib/plugins/search.min.js"></script>
  <script src="https://unpkg.com/docsify-tooltip@1.3.2/dist/docsify-tooltip.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/docsify@4.13.0/lib/themes/vue.css">
  <style>
    .tooltip-content {
      max-width: 420px;
      font-size:14px;
      line-height:1.6;
    }
    .docsify-tooltip-word{
      border-bottom:1px dashed #42b983 !important;
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
window.$docsify = {
  base: '/ml-knowledge/',  // 强制设置仓库子路径！这是github.io子仓库卡死loading关键！
  name: 'ml‑knowledge',
  repo: '',
  loadSidebar: false,
  subMaxLevel: 2,
  homepage: 'README.md',
  notFoundPage: true,
  search: {
    placeholder: "文档搜索"
  },
  tooltip: {
    fullMatch: false,
    caseSensitive: false,
    dictionary: {
      "机器学习": "机器学习是人工智能的一个分支，通过算法从数据中自动学习模式，不需要人工编写全部规则来完成任务。",
      "深度学习": "深度学习是机器学习的子领域，依靠多层神经网络完成特征自动提取，擅长图像、文本等复杂任务。",
      "过拟合": "模型在训练数据集表现极好，但在未知测试数据集泛化能力差。",
      "欠拟合": "模型复杂度不足，训练集与测试集效果都较差。",
      "梯度下降": "机器学习常用优化算法，沿着梯度反方向更新参数，最小化损失函数。"
    }
  }
}
</script>
</body>
</html>
